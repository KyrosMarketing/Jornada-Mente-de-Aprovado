    <section class="cinema" aria-labelledby="cinema-title"><img src="${v("images/student-960.webp")}" width="960" height="1280" loading="lazy" alt="Estudante dedicando um momento de atenção aos estudos, em cena ilustrativa."/><div class="cinema-content container"><span class="eyebrow">PARA O DIA DA PROVA. E PARA O CAMINHO ATÉ LÁ.</span><h2 id="cinema-title">A PROVA É UM DIA.<br>A PREPARAÇÃO<br>É UMA <em>JORNADA.</em></h2><p>Cuide também da mente que acompanha você até lá.</p></div><span class="cinema-caption">IMAGEM ILUSTRATIVA</span></section>

    <section class="faq-section section light" id="duvidas"><div class="container faq-grid"><div>${c("08","CLAREZA PARA O PRÓXIMO PASSO")}<h2>AINDA TEM<br><span class="muted">DÚVIDAS?</span></h2><p>Uma decisão consciente<br>começa com informação.</p><span class="faq-symbol" aria-hidden="true">${n}</span></div><div class="faq-list">${H.map(([a,e])=>`<details class="faq-item"><summary>${a}<span class="expand-icon" aria-hidden="true"></span></summary><div><p>${u(e)}</p></div></details>`).join("")}</div></div></section>

    <section class="final-section section"><div class="container"><span class="eyebrow"><span class="status-dot"></span> O SEU PRÓXIMO PASSO</span><h2>A RETA FINAL<br>COMEÇA <em>NA MENTE.</em></h2><p>Você já percorreu um longo caminho de estudos.<br>Continue sua preparação com a ${o.name}.</p><div class="final-purchase"><strong>${p}</strong>${l("Quero dar esse próximo passo","final")}</div><span class="final-signature">JORNADA MENTE DE APROVADO <span>—</span> POR PREPARAMENTE</span></div></section>
