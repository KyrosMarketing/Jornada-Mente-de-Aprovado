    <section class="cinema" aria-labelledby="cinema-title"><img src="${l("images/student-960.webp")}" width="960" height="1280" loading="lazy" alt="Estudante dedicando um momento de atenção aos estudos, em cena ilustrativa."/><div class="cinema-content container"><span class="eyebrow">PARA O DIA DA PROVA. E PARA O CAMINHO ATÉ LÁ.</span><h2 id="cinema-title">A PROVA É UM DIA.<br>A PREPARAÇÃO<br>É UMA <em>JORNADA.</em></h2><p>Cuide também da mente que acompanha você até lá.</p></div><span class="cinema-caption">IMAGEM ILUSTRATIVA</span></section>

    <section class="faq-section section light" id="duvidas"><div class="container faq-grid"><div>${c("09","CLAREZA PARA O PRÓXIMO PASSO")}<h2>AINDA TEM<br><span class="muted">DÚVIDAS?</span></h2><p>Uma decisão consciente<br>começa com informação.</p><span class="faq-symbol" aria-hidden="true">${r}</span></div><div class="faq-list">${F.map(([e,a])=>`<details class="faq-item"><summary>${e}<span class="expand-icon" aria-hidden="true"></span></summary><div><p>${d(a)}</p></div></details>`).join("")}</div></div></section>
